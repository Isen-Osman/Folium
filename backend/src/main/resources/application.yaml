server:
  port: 8082

spring:
  application:
    name: backend
  security:
    user:
      name: ${DEV_USER_USERNAME:dev}
      password: ${DEV_USER_PASSWORD:dev-password}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/folium}
    username: ${SPRING_DATASOURCE_USERNAME:folium_user}
    password: ${SPRING_DATASOURCE_PASSWORD:FoliumDev2026!}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  upload-dir: uploads
