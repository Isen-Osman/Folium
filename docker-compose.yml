services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: folium
      POSTGRES_USER: folium_user
      POSTGRES_PASSWORD: FoliumDev2026!
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folium_user -d folium"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/folium
      SPRING_DATASOURCE_USERNAME: folium_user
      SPRING_DATASOURCE_PASSWORD: FoliumDev2026!
      JWT_SECRET: "${JWT_SECRET}"
    ports:
      - "8082:8082"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
