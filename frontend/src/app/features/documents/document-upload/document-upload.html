<form class="upload-card" (submit)="upload($event)">
  <label class="dropzone" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
    <input type="file" (change)="onFile($event)" accept=".pdf,.docx,image/*" hidden />
    @if (selectedFile(); as file) {
      <span class="dropzone-title">{{ file.name }}</span>
      <span class="dropzone-hint">Кликни или претегни друг фајл</span>
    } @else {
      <span class="dropzone-title">Претегни фајл тука</span>
      <span class="dropzone-hint">или кликни за избор (PDF, DOCX, слика)</span>
    }
  </label>
  <select [value]="selectedType()" (change)="onType($event)">
    <option value="PDF">PDF</option>
    <option value="IMAGE">IMAGE</option>
    <option value="DOCX">DOCX</option>
  </select>
  <button type="submit" [disabled]="uploading() || !selectedFile()">
    {{ uploading() ? 'Се прикачува...' : 'Прикачи' }}
  </button>
</form>

@if (uploadError()) {
  <app-status-message [message]="uploadError()" [isError]="true" />
} @else if (uploadSuccess()) {
  <app-status-message [message]="uploadSuccess()" />
}
