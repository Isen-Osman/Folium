<header class="topbar">
  <a class="brand" routerLink="/">folium</a>
  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Дома</a>
    <a routerLink="/documents" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Документи</a>
    <a routerLink="/documents/register" routerLinkActive="active">Регистар</a>
    @if (auth.isAuthenticated()) {
      <div class="user-menu">
        <button
          class="user-button"
          type="button"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="menu"
          (click)="toggleMenu($event)"
        >
          <span class="user-avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="user-name">{{ auth.displayName() || 'Профил' }}</span>
          <span class="chevron" aria-hidden="true">▾</span>
        </button>
        @if (menuOpen()) {
          <div class="user-dropdown" role="menu">
            <button class="dropdown-item" type="button" role="menuitem" (click)="logout()">
              Одјави се
            </button>
          </div>
        }
      </div>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Најава</a>
    }
  </nav>
</header>
